plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = findProperty('mod_version') ?: '1.1.0'
group = findProperty('mod_group_id') ?: 'com.example.customsealevel'

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("/*.bbmodel")
    exclude("src/generated//.cache")
}

repositories {}

base {
    archivesName = "NoahFlood-" + (findProperty('mod_version') ?: '1.1.0') + "-neoforge+mc" + (findProperty('minecraft_version') ?: '1.21.1')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', findProperty('mod_id') ?: 'customsealevel'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', findProperty('mod_id') ?: 'customsealevel'
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', findProperty('mod_id') ?: 'customsealevel'
    }

    data {
        arguments.addAll '--mod', (findProperty('mod_id') ?: 'customsealevel'), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }


}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${findProperty('neo_version') ?: '21.1.235'}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : findProperty('minecraft_version') ?: '1.21.1',
            minecraft_version_range: findProperty('minecraft_version_range') ?: '[1.21.1]',
            neo_value              : findProperty('neo_version') ?: '21.1.235',
            loader_version_range   : findProperty('loader_version_range') ?: '[1,)',
            mod_id                 : findProperty('mod_id') ?: 'customsealevel',
            mod_name               : findProperty('mod_name') ?: 'NoahFlood',
            mod_license            : findProperty('mod_license') ?: 'MIT',
            mod_version            : findProperty('mod_version') ?: '1.1.0',
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }


}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = "NoahFlood-" + (findProperty('mod_version') ?: '1.1.0') + "-neoforge+mc" + (findProperty('minecraft_version') ?: '1.21.1')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set("NoahFlood")
    archiveVersion.set("1.1.0")
    archiveClassifier.set("neoforge+mc1.21.1")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}